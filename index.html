<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users API Consumer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    h1 { margin-bottom: 16px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    tr:nth-child(even) { background: #fafafa; }
    .status { margin-bottom: 12px; color: #555; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>Users from JSONPlaceholder API</h1>
  <div class="status" id="status">Loading users...</div>
  <table id="usersTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Username</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Website</th>
        <th>Company</th>
        <th>City</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const statusEl = document.getElementById('status');
    const tbody = document.querySelector('#usersTable tbody');

    async function fetchUsers() {
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/users');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const users = await response.json();
        users.forEach(user => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.name}</td>
            <td>${user.username}</td>
            <td>${user.email}</td>
            <td>${user.phone}</td>
            <td>${user.website}</td>
            <td>${user.company.name}</td>
            <td>${user.address.city}</td>
          `;
          tbody.appendChild(row);
        });
        statusEl.textContent = `Loaded ${users.length} users.`;
      } catch (err) {
        statusEl.textContent = 'Failed to load users: ' + err.message;
        statusEl.classList.add('error');
      }
    }

    fetchUsers();
  </script>
</body>
</html>
